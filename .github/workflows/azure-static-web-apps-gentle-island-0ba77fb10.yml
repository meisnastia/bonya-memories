name: CI/CD — Azure Static Web Apps (GitHub)

# Полноценный конвейер: lint → test → security выполняются параллельно,
# затем deploy (ждёт все три), затем post-deploy smoke-тест против живого сайта.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # для комментария с preview-URL на PR

jobs:
  # ---------- Стадия 1: Lint ----------
  lint:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Lint (HTML/CSS/JS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # ---------- Стадия 2: Test ----------
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          if-no-files-found: ignore

  # ---------- Стадия 3: Security ----------
  security:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Security scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (prod-зависимости, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks — поиск секретов (CLI, MIT)
        run: |
          VERSION=8.28.0
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --exit-code 1

  # ---------- Стадия 4: Deploy ----------
  build_and_deploy_job:
    needs: [lint, test, security]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_ISLAND_0BA77FB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"        # корень репозитория (index.html)
          api_location: ""         # бэкенд-функций нет
          output_location: ""      # сборки нет — пустая строка
          skip_app_build: true     # статический сайт

  # ---------- Стадия 5: Post-deploy smoke test ----------
  smoke_test_job:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Post-deploy smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-тест против живого сайта
        run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: https://gentle-island-0ba77fb10.7.azurestaticapps.net

  # ---------- Закрытие PR (удаление preview-окружения) ----------
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_ISLAND_0BA77FB10 }}
