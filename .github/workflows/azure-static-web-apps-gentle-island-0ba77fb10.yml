name: CI/CD — Azure Static Web Apps (GitHub)

# Конвейер: lint / test / security гоняются на push И на pull_request
# (валидация), а деплой и smoke — ТОЛЬКО на push в main.
# Так PR (в т.ч. от Dependabot и форков) не имеют доступа к секретам
# и не могут задеплоить недоверенный код — это best practice безопасности.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- Lint ----------
  lint:
    runs-on: ubuntu-latest
    name: Lint (HTML/CSS/JS)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # ---------- Test ----------
  test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          if-no-files-found: ignore

  # ---------- Security ----------
  security:
    runs-on: ubuntu-latest
    name: Security scan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (prod-зависимости, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks — поиск секретов (CLI, MIT)
        run: |
          VERSION=8.28.0
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --exit-code 1

  # ---------- Deploy (только push в main) ----------
  build_and_deploy_job:
    needs: [lint, test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      id-token: write        # OIDC-аутентификация в Azure SWA
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_ISLAND_0BA77FB10 }}
          action: upload
          app_location: "/"        # корень репозитория (index.html)
          api_location: ""         # бэкенд-функций нет
          output_location: ""      # сборки нет — пустая строка
          skip_app_build: true     # статический сайт
          github_id_token: ${{ steps.idtoken.outputs.result }}

  # ---------- Post-deploy smoke test (только push) ----------
  smoke_test_job:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Post-deploy smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-тест против живого сайта
        run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: https://gentle-island-0ba77fb10.7.azurestaticapps.net
