version: 2
updates:
  # GitHub Actions — supply-chain безопасность (одним сгруппированным PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # npm dev-зависимости (линтеры) — одним PR, без ломающих мажорных версий
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
