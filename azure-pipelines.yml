# Azure DevOps Pipeline — CI/CD для Azure Static Web Apps.
# Все проверки — ШАГАМИ внутри минимального числа джоб: бесплатный тариф ADO
# даёт лишь 1 параллельный Microsoft-hosted агент, поэтому дробить на много
# джоб нет смысла (только очередь и лишние ожидания агента).
#   Стадия Validate: lint → test → security (шаги)
#   Стадия Deploy:   deploy → post-deploy smoke (шаги, один агент)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest      # AzureStaticWebApp@0 работает только на Linux

variables:
  SMOKE_BASE_URL: https://witty-ground-06bccd310.7.azurestaticapps.net
  # deployment_token — СЕКРЕТНАЯ переменная пайплайна (не в коде).

stages:
  # ---------- Стадия 1: Validate (lint + test + security как шаги) ----------
  - stage: Validate
    displayName: Проверки
    jobs:
      - job: checks
        displayName: lint · test · security
        steps:
          - task: NodeTool@0
            displayName: Node.js 20
            inputs:
              versionSpec: '20.x'
          - script: npm ci
            displayName: npm ci

          # -- Lint --
          - script: npm run lint
            displayName: 'Lint: html-validate + stylelint + eslint'

          # -- Test (+ публикация JUnit) --
          - script: npm run test:ci
            displayName: 'Test: node --test (JUnit)'
          - task: PublishTestResults@2
            displayName: Публикация результатов тестов
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'junit.xml'
              testRunTitle: 'Unit tests'

          # -- Security --
          - script: npm audit --omit=dev --audit-level=high
            displayName: 'Security: npm audit (high+)'
          - script: |
              VERSION=8.28.0
              curl -sSL -o gitleaks.tar.gz \
                https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
              tar -xzf gitleaks.tar.gz gitleaks
              ./gitleaks dir . --redact --exit-code 1
            displayName: 'Security: gitleaks (поиск секретов)'

  # ---------- Стадия 2: Deploy + post-deploy smoke ----------
  - stage: Deploy
    displayName: Деплой и smoke-тест
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: deploy
        displayName: deploy · smoke
        steps:
          - checkout: self
          - task: AzureStaticWebApp@0
            displayName: 'Deploy: Azure Static Web App'
            inputs:
              app_location: "/"
              api_location: ""
              output_location: ""     # пусто при skip_app_build
              skip_app_build: true
              skip_api_build: true
            env:
              azure_static_web_apps_api_token: $(deployment_token)
          - task: NodeTool@0
            displayName: Node.js 20
            inputs:
              versionSpec: '20.x'
          - script: node scripts/smoke.mjs
            displayName: 'Post-deploy: smoke-тест живого сайта'
            env:
              SMOKE_BASE_URL: $(SMOKE_BASE_URL)
